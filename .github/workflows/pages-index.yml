# Rebuild the PEP 503 index on GitHub Pages whenever a release changes.
# Output: https://colingao77.github.io/vial/simple  (Settings, Pages, Source: GitHub Actions)
name: pages-index

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the index from the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_index.py "$GITHUB_REPOSITORY" site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
